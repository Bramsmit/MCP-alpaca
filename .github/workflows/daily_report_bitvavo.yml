name: Trading Bot Bitvavo — Dagrapport

on:
  schedule:
    - cron: '0 20 * * *'   # Dagelijks 20:00 UTC = 22:00 Amsterdam (zomer)
  workflow_dispatch:        # Handmatig starten via GitHub UI

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Herstel state (dagstart waarde)
        uses: actions/cache@v4
        with:
          path: |
            .alpaca_trade_state.json
            trades.jsonl
            .alpaca_day_state.json
          key: bitvavo-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bitvavo-state-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer dependencies
        run: pip install -r bot/requirements.txt

      - name: Stuur dagelijks portfoliorapport Bitvavo
        env:
          BITVAVO_API_KEY: ${{ secrets.BITVAVO_API_KEY }}
          BITVAVO_SECRET_KEY: ${{ secrets.BITVAVO_SECRET_KEY }}
          BITVAVO_DRY_RUN: ${{ secrets.BITVAVO_DRY_RUN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BITVAVO_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BITVAVO_TELEGRAM_CHAT_ID }}
        run: python -m bot.daily_report
