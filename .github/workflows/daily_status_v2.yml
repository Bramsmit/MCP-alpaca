name: Trading Bot v2 — Heartbeat

on:
  schedule:
    - cron: '0 9 * * *'   # Dagelijks 9:00 UTC (11:00 Amsterdam zomer)
  workflow_dispatch:       # Handmatig testen

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Stuur heartbeat v2
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.ALPACA_V2_TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ALPACA_V2_TELEGRAM_CHAT_ID }}" \
            -d "text=✅ Trading Bot v2: actief. Volgende run over ~60 min."
