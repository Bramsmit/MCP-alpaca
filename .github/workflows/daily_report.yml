name: Dagelijks rapport (alle bots)
on:
  schedule:
    - cron: '0 20 * * *'   # 20:00 UTC = 22:00 Amsterdam
  workflow_dispatch:

jobs:
  report-alpaca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            .alpaca_trade_state.json
            trades.jsonl
            alpaca_runs.jsonl
            .alpaca_day_state.json
            .alpaca_safety_state.json
          key: alpaca-trade-${{ runner.os }}-${{ hashFiles('trades.jsonl', '.alpaca_trade_state.json') }}
          restore-keys: |
            alpaca-trade-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'bot_live/requirements.txt'

      - name: Install dependencies
        run: pip install -r bot_live/requirements.txt

      - name: Dagrapport Alpaca
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot_live.daily_report

  report-bitvavo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            .bitvavo_trade_state.json
            bitvavo_trades.jsonl
            bitvavo_runs.jsonl
            .bitvavo_day_state.json
          key: bitvavo-state-${{ runner.os }}-${{ hashFiles('bitvavo_trades.jsonl', '.bitvavo_trade_state.json') }}
          restore-keys: |
            bitvavo-state-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'bot_live/requirements.txt'

      - name: Install dependencies
        run: pip install -r bot_live/requirements.txt

      - name: Dagrapport Bitvavo
        env:
          BITVAVO_API_KEY: ${{ secrets.BITVAVO_API_KEY }}
          BITVAVO_SECRET_KEY: ${{ secrets.BITVAVO_SECRET_KEY }}
          BITVAVO_DRY_RUN: ${{ secrets.BITVAVO_DRY_RUN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BITVAVO_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BITVAVO_TELEGRAM_CHAT_ID }}
        run: python -m bot_live.bitvavo_daily_report

  report-hybrid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            .alpaca_hybrid_state.json
            .alpaca_trade_state.json
            trades.jsonl
            .alpaca_day_state.json
          key: alpaca-v2-state-${{ runner.os }}-${{ hashFiles('trades.jsonl', '.alpaca_hybrid_state.json') }}
          restore-keys: |
            alpaca-v2-state-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'bot_live/requirements.txt'

      - name: Install dependencies
        run: pip install -r bot_live/requirements.txt

      - name: Dagrapport Hybrid v2
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_V2_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_V2_SECRET_KEY }}
          ALPACA_PAPER_TRADE: ${{ secrets.ALPACA_V2_PAPER_TRADE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.ALPACA_V2_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ALPACA_V2_TELEGRAM_CHAT_ID }}
        run: python -m bot_live.daily_report
