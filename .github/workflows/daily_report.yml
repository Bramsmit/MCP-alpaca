name: Dagelijks rapport (Alpaca range)
on:
  schedule:
    - cron: '0 20 * * *'   # 20:00 UTC = 22:00 Amsterdam
  workflow_dispatch:

# De jobs voor hybrid v2 en Bitvavo stonden hier ook, maar de repo heeft geen
# ALPACA_V2_* / BITVAVO_* secrets: die faalden elke dag op een lege API-key en
# hielden de hele workflow rood. Beide bots staan zelf ook uit. Zodra er weer
# een tweede bot live gaat, komt hij hier met eigen secrets terug.
jobs:
  report-alpaca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            .alpaca_trade_state.json
            trades.jsonl
            alpaca_runs.jsonl
            .alpaca_day_state.json
            .alpaca_safety_state.json
          key: alpaca-trade-${{ runner.os }}-${{ hashFiles('trades.jsonl', '.alpaca_trade_state.json') }}
          restore-keys: |
            alpaca-trade-${{ runner.os }}-

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'bot_live/requirements.txt'

      - name: Install dependencies
        run: pip install -r bot_live/requirements.txt

      - name: Dagrapport Alpaca
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot_live.daily_report

      # Zonder deze stap faalt het rapport stil: juni-september 2026 ging elke
      # dag rood zonder dat iemand het merkte.
      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ Alpaca dagrapport gefaald. Check GitHub Actions."
