name: Dagelijks Portfoliorapport
on:
  schedule:
    - cron: '0 8 * * *'   # Dagelijks 8:00 UTC (9:00 Amsterdam)
  workflow_dispatch:      # Handmatig starten via GitHub UI
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r bot_live/requirements.txt

      - name: Stuur dagelijks portfoliorapport
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot_live.daily_report
