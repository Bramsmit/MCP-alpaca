name: Trading Bot v2 — Hourly

on:
  schedule:
    - cron: '0 * * * *'   # Elk uur op het hele uur
  workflow_dispatch:       # Handmatig starten via GitHub UI

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Herstel state (orders + trades)
        uses: actions/cache@v4
        with:
          path: |
            .alpaca_trade_state.json
            trades.jsonl
            .alpaca_day_state.json
          key: alpaca-v2-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alpaca-v2-state-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer dependencies
        run: pip install -r bot/requirements.txt

      - name: Draai trading bot
        id: trade
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_V2_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_V2_SECRET_KEY }}
          ALPACA_PAPER_TRADE: ${{ secrets.ALPACA_V2_PAPER_TRADE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.ALPACA_V2_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ALPACA_V2_TELEGRAM_CHAT_ID }}
        run: python -m bot.live_trader

      - name: Melding bij fout
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.ALPACA_V2_TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ALPACA_V2_TELEGRAM_CHAT_ID }}" \
            -d "text=❌ Trading Bot v2 heeft gefaald. Check GitHub Actions voor details."
