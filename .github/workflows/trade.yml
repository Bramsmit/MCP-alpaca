name: Trading Bot — Alpaca range
on:
  schedule:
    - cron: '0 * * * *'   # Elk uur
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            .alpaca_trade_state.json
            trades.jsonl
            alpaca_runs.jsonl
            .alpaca_day_state.json
          key: alpaca-trade-${{ runner.os }}-${{ hashFiles('trades.jsonl', '.alpaca_trade_state.json') }}
          restore-keys: |
            alpaca-trade-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'bot_live/requirements.txt'

      - name: Install dependencies
        run: pip install -r bot_live/requirements.txt

      - name: Run trading bot
        id: trade
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot_range_1000.live_trader

      - name: Export en bewaar trade-log in repo
        if: always()
        continue-on-error: true   # push-fout mag bot-run niet laten falen
        run: |
          python -m bot_live.export_trade_log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebase + commit
          git pull --rebase origin main 2>/dev/null || true
          git add data/alpaca_trades.jsonl data/alpaca_trades.csv
          if git diff --cached --quiet; then
            echo "Geen nieuwe trades, skip push."
            exit 0
          fi
          git commit -m "chore: trade log $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"

          # Retry tot 3 keer bij push-conflict (concurrent runs)
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push geslaagd (poging $attempt)."
              exit 0
            fi
            echo "Push poging $attempt mislukt, rebase en opnieuw..."
            git pull --rebase origin main 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "⚠️  Push na 3 pogingen mislukt; data bewaard in cache."
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ Alpaca range-bot gefaald. Check GitHub Actions."
