name: Trading Bot
on:
  schedule:
    - cron: '0 * * * *'   # Elk uur op het hele uur
  workflow_dispatch:      # Handmatig starten via GitHub UI
jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            .alpaca_trade_state.json
            trades.jsonl
            alpaca_runs.jsonl
            .alpaca_day_state.json
          key: alpaca-trade-state-${{ runner.os }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r bot_live/requirements.txt

      - name: Run trading bot
        id: trade
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot_range_1000.live_trader

      - name: Upload journals
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-journals-${{ github.run_id }}
          path: |
            trades.jsonl
            alpaca_runs.jsonl
            .alpaca_trade_state.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ Trading bot heeft gefaald. Check GitHub Actions voor details."
