name: Trading Bot — Hybrid v2 (hourly)
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: trade-v2
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            .alpaca_hybrid_state.json
            .alpaca_trade_state.json
            trades.jsonl
            .alpaca_day_state.json
          key: alpaca-v2-state-${{ runner.os }}-${{ hashFiles('trades.jsonl', '.alpaca_hybrid_state.json') }}
          restore-keys: |
            alpaca-v2-state-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'bot_live/requirements.txt'

      - name: Install dependencies
        run: pip install -r bot_live/requirements.txt

      - name: Run hybrid bot v2
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_V2_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_V2_SECRET_KEY }}
          ALPACA_PAPER_TRADE: ${{ secrets.ALPACA_V2_PAPER_TRADE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.ALPACA_V2_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ALPACA_V2_TELEGRAM_CHAT_ID }}
          HYBRID_ENABLED: "true"
          DRY_RUN: "false"
        run: python -m bot_hybrid.hybrid_trader

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.ALPACA_V2_TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ALPACA_V2_TELEGRAM_CHAT_ID }}" \
            -d "text=❌ Hybrid bot v2 gefaald. Check GitHub Actions."
