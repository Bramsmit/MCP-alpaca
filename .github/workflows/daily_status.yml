name: Dagelijkse heartbeat (alle bots)
on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 11:00 Amsterdam
  workflow_dispatch:

jobs:
  heartbeat-alpaca:
    runs-on: ubuntu-latest
    steps:
      - name: Alpaca range-bot heartbeat
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ Alpaca range-bot: actief."

  heartbeat-kraken:
    runs-on: ubuntu-latest
    steps:
      - name: Kraken bot heartbeat
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN_KRAKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID_KRAKEN }}" \
            -d "text=✅ Kraken range-bot: actief."

  heartbeat-bitvavo:
    runs-on: ubuntu-latest
    steps:
      - name: Bitvavo bot heartbeat
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BITVAVO_TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BITVAVO_TELEGRAM_CHAT_ID }}" \
            -d "text=✅ Bitvavo bot: actief."
