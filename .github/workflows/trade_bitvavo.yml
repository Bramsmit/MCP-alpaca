name: Trading Bot — Bitvavo hourly
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            .bitvavo_trade_state.json
            bitvavo_trades.jsonl
            bitvavo_runs.jsonl
            .bitvavo_day_state.json
          key: bitvavo-state-${{ runner.os }}-${{ hashFiles('bitvavo_trades.jsonl', '.bitvavo_trade_state.json') }}
          restore-keys: |
            bitvavo-state-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'bot_live/requirements.txt'

      - name: Install dependencies
        run: pip install -r bot_live/requirements.txt

      - name: Run Bitvavo bot
        env:
          BITVAVO_API_KEY: ${{ secrets.BITVAVO_API_KEY }}
          BITVAVO_SECRET_KEY: ${{ secrets.BITVAVO_SECRET_KEY }}
          BITVAVO_DRY_RUN: ${{ secrets.BITVAVO_DRY_RUN }}
          BITVAVO_POST_ONLY: ${{ secrets.BITVAVO_POST_ONLY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BITVAVO_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BITVAVO_TELEGRAM_CHAT_ID }}
        run: python -m bot_live.bitvavo_trader

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BITVAVO_TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BITVAVO_TELEGRAM_CHAT_ID }}" \
            -d "text=❌ Bitvavo bot gefaald. Check GitHub Actions."
